version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: myshopbd_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: myshopbd
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    container_name: myshopbd_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:password@postgres:5432/myshopbd?schema=public
      PORT: 3000
    depends_on:
      - postgres

volumes:
  pgdata:
